apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world-deployment
spec:
  replicas: 2 # 2개의 Pod를 실행
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
      - name: hello-world-api
        # 2.2 단계에서 푸시한 이미지 주소
        image: asia-northeast3-docker.pkg.dev/your-gcp-project-id/a-connect-backend-repo/hello-world-api:v1
        ports:
        - containerPort: 8080 # Dockerfile에서 노출한 포트