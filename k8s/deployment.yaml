apiVersion: apps/v1
kind: Deployment
metadata:
  name: amori-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: amori-backend
  template:
    metadata:
      labels:
        app: amori-backend
    spec:
      containers:
      - name: amori-backend-container
        image: asia-northeast1-docker.pkg.dev/amori-475204/amori-docker-images/amori-backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: amori-secrets
              key: db-host
        - name: DB_PORT
          value: "3306"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: amori-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: amori-secrets
              key: db-password
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: amori-secrets
              key: db-name
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: amori-secrets
              key: jwt-secret-key
        - name: JWT_ALGORITHM
          value: "HS256"
        - name: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
          value: "1440"
        - name: GCS_BUCKET_NAME
          value: "amori-photos"
        - name: FRONTEND_URL
          value: "http://amori.co.kr"
        resources:
          requests:
            cpu: "100m"     # 100 millicpu (0.1 CPU)
            memory: "128Mi" # 128 Mebibytes
        readinessProbe:
          httpGet:
            path: /  
            port: 8080 
          initialDelaySeconds: 60 
          periodSeconds: 10     
          timeoutSeconds: 5
          failureThreshold: 3       
        
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 15
          timeoutSeconds: 5