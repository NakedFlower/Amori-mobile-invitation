apiVersion: apps/v1
kind: Deployment
metadata:
  name: amori-backend
  labels:
    app: amori-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: amori-backend
  template:
    metadata:
      labels:
        app: amori-backend
    spec:
      containers:
      - name: amori-backend
        image: asia-northeast1-docker.pkg.dev/amori-475204/amori-docker-images/amori-backend:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5