apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: amori-backend-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "amori-backend-ip"
spec:
  rules:
  - host: api.amori.co.kr
    http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: amori-backend-service
            port:
              number: 80
  - http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: amori-backend-service
            port:
              number: 80