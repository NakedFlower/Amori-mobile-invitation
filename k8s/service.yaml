apiVersion: v1
kind: Service
metadata:
  name: hello-world-service
spec:
  # Ingress와 함께 사용할 때는 NodePort 또는 ClusterIP
  # GKE Ingress는 NEG(Network Endpoint Group)를 통해 Pod에 직접 라우팅하므로 ClusterIP도 좋지만,
  # 가장 보편적인 NodePort를 사용하겠습니다.
  type: NodePort
  selector:
    app: hello-world # deployment.yaml의 Pod 라벨과 일치
  ports:
  - protocol: TCP
    port: 80       # 서비스가 클러스터 내부에서 노출할 포트
    targetPort: 8080 # Pod의 컨테이너 포트