name: Deploy Backend to GKE

on:
  push:
    branches:
      - dev/back

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker asia-northeast1-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          IMAGE_NAME=asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/amori-docker-images/amori-backend:latest
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME
      
      - name: Install gke-gcloud-auth-plugin
        run: gcloud components install gke-gcloud-auth-plugin

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials amori-cluster --zone=asia-northeast1

      - name: Deploy to GKE
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl rollout restart deployment/amori-backend
          kubectl rollout status deployment/amori-backend

      - name: Verify deployment
        run: echo "✅ Deployment completed successfully!"