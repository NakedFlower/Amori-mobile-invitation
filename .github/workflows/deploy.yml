name: Deploy to GCP Storage
on:
  push:
    branches:
      - dev/front
jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build React app
        run: npm run build
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Upload to GCS bucket
        run: |
          gsutil -m rsync -r -d build/ gs://amori-frontend-codes/
      - name: Set Cache-Control headers
        run: |
          gsutil -m setmeta -h "Cache-Control:public, max-age=31536000" gs://amori-frontend-codes/**/*.js
          gsutil -m setmeta -h "Cache-Control:public, max-age=31536000" gs://amori-frontend-codes/**/*.css
          gsutil -m setmeta -h "Cache-Control:public, max-age=3600" gs://amori-frontend-codes/index.html
      - name: Invalidate CDN cache
        run: |
          gcloud compute url-maps invalidate-cdn-cache amori-lb-frontend \
            --path "/*" \
            --async
      - name: Deployment completed
        run: echo "✅ Deployment to GCS completed successfully!"